<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Tidak Ada Koneksi - Catatan Keuangan</title>
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --accent: #4f46e5; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0b0f19; --card: #131a29; --text: #f1f5f9; --muted: #94a3b8; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 24px;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        }
        .card { background: var(--card); border-radius: 20px; padding: 32px 24px; max-width: 360px; width: 100%;
                box-shadow: 0 12px 28px -8px rgba(15, 23, 42, 0.12); }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { font-size: 1.25rem; margin: 20px 0 8px; }
        p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 24px; }
        button { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 600;
                 background: var(--accent); color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>Tidak ada koneksi internet</h1>
        <p>Catatan Keuangan membutuhkan internet agar data Anda selalu aman dan terbaru. Periksa koneksi Anda, lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
